name: Testes

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Reconstruir data.json a partir dos CSVs versionados
        run: python pipeline/build.py

      - name: Build é reprodutível
        run: |
          if ! git diff --quiet -- public/data.json; then
            echo "::error::public/data.json commitado difere do que build.py gera a partir dos CSVs."
            git diff --stat -- public/data.json
            exit 1
          fi
          echo "data.json commitado bate com o build."

      - name: Invariantes do data.json
        run: python pipeline/selftest.py

      - name: Checagens do arquivador de fontes sem histórico
        run: python pipeline/test_snapshots.py

      - name: Dados da página (data/web) batem com o pipeline
        run: |
          python pipeline/build_web.py
          if ! git diff --quiet -- data/web; then
            echo "::error::data/web commitado difere do que build_web.py gera."
            git diff --stat -- data/web
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Motor da página contra o pipeline
        run: npm run test:engine

      - name: Conteúdo e tipos
        run: npm run typecheck

      - name: Build do Next
        run: npm run build

      # Binário local do playwright: o npx pode buscar outra versão do registry.
      - name: Instalar Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: |
          npx next start -p 3099 &
          for i in $(seq 1 60); do curl -sf http://localhost:3099/ >/dev/null && break; sleep 1; done
          node tests/e2e.mjs http://localhost:3099
