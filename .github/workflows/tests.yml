name: Testes

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Uma rodada por dia no main: os commits do bot (dado) não disparam os Testes, então um main
  # quebrado pelo dado só aparecia no PR da pauta, e barrava a pauta (26, 28 e 30/10). Com esta
  # rodada, a quebra vira issue antes. Hora: depois do commit diário do dado, que chega ~12-14 UTC.
  schedule:
    - cron: "40 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      # O as_of do data.json é a data do relógio em que o build rodou ("pipeline
      # atualizado em"), então muda todo dia sem nenhum dado mudar. A comparação
      # ignora só esse campo; qualquer outra diferença é número que o pipeline
      # não produz, e derruba o teste. Antes, o teste falhava sempre que rodava
      # num dia diferente do último commit do bot.
      - name: Reconstruir data.json a partir dos CSVs versionados
        run: |
          cp public/data.json "$RUNNER_TEMP/data.commitado.json"
          python pipeline/build.py

      - name: Build é reprodutível
        run: |
          python - "$RUNNER_TEMP/data.commitado.json" public/data.json <<'PY'
          import json, sys
          a, b = (json.load(open(f)) for f in sys.argv[1:3])
          a.pop("as_of", None); b.pop("as_of", None)
          dif = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
          if dif:
              print("::error::public/data.json commitado difere do que build.py gera, nas chaves: " + ", ".join(dif))
              sys.exit(1)
          print("data.json commitado bate com o build (as_of ignorado).")
          PY

      - name: Invariantes do data.json
        run: python pipeline/selftest.py

      - name: Checagens do arquivador de fontes sem histórico
        run: python pipeline/test_snapshots.py

      - name: Checagens do Radar
        run: python pipeline/test_news.py

      - name: Checagens da pauta
        run: python pipeline/test_pauta.py

      - name: Checagens dos movimentos dos laboratórios
        run: python pipeline/test_movimentos.py

      - name: Dados da página (data/web) batem com o pipeline
        run: |
          python pipeline/build_web.py
          if ! git diff --quiet -- data/web; then
            echo "::error::data/web commitado difere do que build_web.py gera."
            git diff --stat -- data/web
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Motor da página contra o pipeline
        run: npm run test:engine

      - name: Formatação e rótulos por idioma (português idêntico à v1)
        run: npm run test:format

      - name: Conteúdo e tipos
        run: npm run typecheck

      - name: Build do Next
        run: npm run build

      # Binário local do playwright: o npx pode buscar outra versão do registry.
      - name: Instalar Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: |
          npx next start -p 3099 &
          for i in $(seq 1 60); do curl -sf http://localhost:3099/ >/dev/null && break; sleep 1; done
          node tests/e2e.mjs http://localhost:3099

      - name: Abrir issue se o main quebrou na rodada diária
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const titulo = 'Testes do main falharam na rodada diária';
            const abertas = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline' });
            if (abertas.data.some(i => i.title === titulo)) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: titulo, labels: ['pipeline'],
              body: [`@${context.repo.owner} Os Testes falharam no main, sem nenhum commit de código: a causa costuma ser o dado do dia.`,
                     'Enquanto isso não for corrigido, a próxima pauta também vai falhar nos Testes e não será publicada.', '', `**Run:** ${run}`].join('\n'),
            });
